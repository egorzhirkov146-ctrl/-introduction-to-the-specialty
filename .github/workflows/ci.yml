name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  semgrep-security:
    name: Статический анализ безопасности (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Запуск Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/semgrep.yml
