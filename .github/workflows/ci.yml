name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  simple-check:
    name: Простая проверка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Проверка наличия README
        run: |
          if [ -f "README.md" ]; then
            echo "✅ README.md найден"
          else
            echo "❌ README.md не найден"
            exit 1
          fi

      - name: Проверка наличия backend
        run: |
          if [ -d "backend" ]; then
            echo "✅ backend найден"
          else
            echo "❌ backend не найден"
            exit 1
          fi

      - name: Проверка наличия frontend
        run: |
          if [ -d "frontend" ]; then
            echo "✅ frontend найден"
          else
            echo "❌ frontend не найден"
            exit 1
          fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [simple-check]
    if: always()
    steps:
      - run: echo "✅ Все проверки пройдены"
