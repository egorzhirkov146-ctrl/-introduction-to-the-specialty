name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  semgrep-security:
    name: Статический анализ безопасности (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Запуск Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/semgrep.yml
        continue-on-error: false

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, semgrep-security]
    if: always()

    steps:
      - run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit тесты не пройдены"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration тесты не пройдены"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "E2E тесты не пройдены"
            exit 1
          fi
          if [[ "${{ needs.semgrep-security.result }}" != "success" ]]; then
            echo "Semgrep анализ не пройден"
            exit 1
          fi
          echo "Все проверки пройдены"
