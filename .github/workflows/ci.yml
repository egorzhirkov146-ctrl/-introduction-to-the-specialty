name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  simple-check:
    name: Простая проверка
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v3

      - name: Проверка наличия README
        run: |
          if [ -f "README.md" ]; then
            echo "README.md найден"
          else
            echo "README.md не найден"
            exit 1
          fi

      - name: Проверка наличия frontend/index.html
        run: |
          if [ -f "frontend/index.html" ]; then
            echo "frontend/index.html найден"
          else
            echo "frontend/index.html не найден"
            exit 1
          fi

      - name: Проверка наличия backend/server.js
        run: |
          if [ -f "backend/server.js" ]; then
            echo "backend/server.js найден"
          else
            echo "backend/server.js не найден"
            exit 1
          fi
