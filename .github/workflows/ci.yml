name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  html-check:
    name: Проверка HTML
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка html-validator
        run: npm install -g html-validate

      - name: Проверка index.html
        run: html-validate frontend/index.html

  prettier-check:
    name: Проверка форматирования (Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Запуск Prettier проверки
        run: |
          npx prettier --check frontend/index.html --write

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [html-check, prettier-check]
    if: always()

    steps:
      - name: Проверка всех джоб
        run: |
          if [[ "${{ needs.html-check.result }}" != "success" ]]; then
            echo "Ошибка: HTML проверка не пройдена"
            exit 1
          fi
          if [[ "${{ needs.prettier-check.result }}" != "success" ]]; then
            echo "Ошибка: форматирование не пройдено"
            exit 1
          fi
          echo "Все проверки пройдены! PR можно мёржить."
