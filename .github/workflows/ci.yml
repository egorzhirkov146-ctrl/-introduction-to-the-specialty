name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  semgrep-security:
    name: Статический анализ безопасности (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Запуск Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/semgrep.yml

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [semgrep-security]
    if: always()

    steps:
      - name: Проверка статуса
        run: |
          echo "Semgrep анализ завершён"
          echo "Все проверки пройдены! PR можно мёржить."
