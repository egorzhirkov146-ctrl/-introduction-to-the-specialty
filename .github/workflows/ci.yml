name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  semgrep-security:
    name: Статический анализ безопасности (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Запуск Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/semgrep.yml
        continue-on-error: false

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [semgrep-security]
    if: always()

    steps:
      - name: Проверка Semgrep
        run: |
          if [[ "${{ needs.semgrep-security.result }}" != "success" ]]; then
            echo "Semgrep анализ не пройден"
            exit 1
          fi
          echo "Все проверки пройдены"
