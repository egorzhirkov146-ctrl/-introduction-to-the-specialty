<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-калькулятор</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.02);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .error {
            background: #fee;
            color: #c33;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор</h1>
        <input type="number" id="num1" placeholder="Первое число">
        <select id="operation">
            <option value="+">+ (Сложение)</option>
            <option value="-">- (Вычитание)</option>
            <option value="*">× (Умножение)</option>
            <option value="/">÷ (Деление)</option>
        </select>
        <input type="number" id="num2" placeholder="Второе число">
        <button id="calculate">Вычислить</button>
        <div id="result" class="result">Результат: —</div>
    </div>

    <script>
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const operationSelect = document.getElementById('operation');
        const calculateBtn = document.getElementById('calculate');
        const resultDiv = document.getElementById('result');

        async function calculate() {
            const num1 = parseFloat(num1Input.value);
            const num2 = parseFloat(num2Input.value);
            const operation = operationSelect.value;

            if (isNaN(num1) || isNaN(num2)) {
                resultDiv.textContent = 'Ошибка: введите числа';
                resultDiv.classList.add('error');
                return;
            }

            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ num1, num2, operation })
                });
                const data = await response.json();
                if (data.error) {
                    resultDiv.textContent = `Ошибка: ${data.error}`;
                    resultDiv.classList.add('error');
                } else {
                    resultDiv.textContent = `Результат: ${data.result}`;
                    resultDiv.classList.remove('error');
                }
            } catch (error) {
                resultDiv.textContent = 'Ошибка: сервер недоступен';
                resultDiv.classList.add('error');
            }
        }

        calculateBtn.addEventListener('click', calculate);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculate();
        });
    </script>
</body>
</html>
